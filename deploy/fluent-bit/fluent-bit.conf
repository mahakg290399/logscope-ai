# ==============================================================================
# LogScope AI - Production Fluent Bit Daemon Configuration
# Battle-tested log collection agent for Docker hosts, Kubernetes DaemonSets,
# and standalone Linux/VM environments.
# ==============================================================================

[SERVICE]
    Flush             1
    Log_Level         info
    Daemon            off
    Parsers_File      parsers.conf
    HTTP_Server       on
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      on
    HC_Errors_Count   5
    HC_Retry_Failure_Count 5
    Storage.path      /fluent-bit/data/storage
    Storage.sync      normal
    Storage.checksum  off
    Storage.backlog.mem_limit 10M

# ------------------------------------------------------------------------------
# INPUT: Container & Application Logs
# ------------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               app.logs.*
    Path              /var/log/containers/*.log,/app/logs/*.log,/var/log/app/*.log
    Parser            docker
    DB                /fluent-bit/data/flb_logscope.db
    DB.Sync           Normal
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  2
    Read_from_Head    Off
    Storage.type      filesystem

# ------------------------------------------------------------------------------
# INPUT: System & Kernel Logs (Optional)
# ------------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               sys.logs.*
    Path              /var/log/syslog,/var/log/messages
    Parser            syslog-rfc3164
    DB                /fluent-bit/data/flb_syslog.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

# ------------------------------------------------------------------------------
# FILTER: Enrich Logs with Environment & Application Metadata
# ------------------------------------------------------------------------------
[FILTER]
    Name              modify
    Match             app.logs.*
    Add               application ${LOGSCOPE_APP_NAME:-production-service}
    Add               environment ${LOGSCOPE_ENV:-production}
    Add               source_name fluent-bit-agent

[FILTER]
    Name              modify
    Match             sys.logs.*
    Add               application system-kernel
    Add               environment ${LOGSCOPE_ENV:-production}
    Add               source_name host-syslog

# ------------------------------------------------------------------------------
# OUTPUT: High-Throughput HTTP Forwarding to LogScope AI
# ------------------------------------------------------------------------------
[OUTPUT]
    Name              http
    Match             *
    Host              ${LOGSCOPE_HOST:-logscope}
    Port              ${LOGSCOPE_PORT:-8000}
    URI               /api/logs
    Format            json
    Header            Content-Type application/json
    Retry_Limit       5
    Workers           2

# ------------------------------------------------------------------------------
# OUTPUT (ALTERNATIVE): Direct Kafka Streaming (Interface 2)
# Uncomment to stream raw logs directly to LogScope Kafka topic instead of HTTP:
